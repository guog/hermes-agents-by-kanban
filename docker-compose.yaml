services:
  controller:
    image: ${HOLLYSYS_IMAGE:-hollysys-hermes-agents:latest}
    build:
      context: .
      args:
        HERMES_BASE_IMAGE: ${HERMES_BASE_IMAGE:-nousresearch/hermes-agent:v2026.7.30}
    platform: linux/amd64
    container_name: ${HOLLYSYS_CONTROLLER_CONTAINER_NAME:-hollysys-controller}
    init: true
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /opt/fleet/container/run-hollysys-controller.sh
    env_file:
      - .env
    environment:
      HERMES_HOME: /opt/data
      HERMES_SCRATCH_DIR: /opt/data/scratch
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace/projects
      HOLLYSYS_CONTROLLER_CONFIG: /opt/hollysys-controller/config.yaml
      HOLLYSYS_CONTROLLER_STATE_DIR: /var/lib/hollysys-controller
      HOLLYSYS_CONTROLLER_LOCK: /var/lib/hollysys-controller/controller.lock
      HOLLYSYS_CONTROLLER_SOCKET: /run/hollysys-controller/controller.sock
      HOLLYSYS_WORKER_SUPERVISOR_SOCKET: /run/hollysys-controller/worker-supervisor.sock
      HOLLYSYS_CONTROLLER_GITLAB_TOKEN_FILE: /run/secrets/hollysys_controller_gitlab_token
      PATH: /run/hollysys/bin:/opt/cli/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PIP_CONFIG_FILE: /etc/pip.conf
      NPM_CONFIG_USERCONFIG: /opt/fleet/container/mirrors/npmrc
    volumes:
      - ${HERMES_DATA_DIR:-./data}:/opt/data
      - ${PROJECTS_DIR:-./projects}:/workspace/projects
      - ${HOLLYSYS_CONTROLLER_DATA_DIR:-./controller-data}:/var/lib/hollysys-controller
      - controller-socket:/run/hollysys-controller
      - ./controller/config.yaml:/opt/hollysys-controller/config.yaml:ro
      - ./container:/opt/fleet/container:ro
      - ./skills:/opt/skills:ro
      - ./templates:/opt/fleet/templates:ro
      - ./schemas:/opt/fleet/schemas:ro
    secrets:
      - source: hollysys_controller_gitlab_token
        target: hollysys_controller_gitlab_token
        mode: 0400
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/hollysysctl
        - health
        - --probe
        - liveness
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  hermes:
    image: ${HOLLYSYS_IMAGE:-hollysys-hermes-agents:latest}
    build:
      context: .
      args:
        HERMES_BASE_IMAGE: ${HERMES_BASE_IMAGE:-nousresearch/hermes-agent:v2026.7.30}
    platform: linux/amd64
    container_name: ${HERMES_CONTAINER_NAME:-hermes}
    restart: unless-stopped
    command: ["sleep", "infinity"]
    depends_on:
      controller:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_HOME: /opt/data
      HERMES_SCRATCH_DIR: /opt/data/scratch
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace/projects
      HOLLYSYS_CONTROLLER_SOCKET: /run/hollysys-controller/controller.sock
      HOLLYSYS_WORKER_SUPERVISOR_SOCKET: /run/hollysys-controller/worker-supervisor.sock
      HOLLYSYS_CONTROLLER_CONFIG: /opt/hollysys-controller/config.yaml
      PATH: /run/hollysys/bin:/opt/cli/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PIP_CONFIG_FILE: /etc/pip.conf
      NPM_CONFIG_USERCONFIG: /opt/fleet/container/mirrors/npmrc
    ports:
      - "${HERMES_DASHBOARD_HOST_PORT:-9119}:9119"
    volumes:
      - ${HERMES_DATA_DIR:-./data}:/opt/data
      - ${PROJECTS_DIR:-./projects}:/workspace/projects
      - controller-socket:/run/hollysys-controller
      - ./cli:/opt/cli:ro
      - ./skills:/opt/skills:ro
      - ./controller/config.yaml:/opt/hollysys-controller/config.yaml:ro
      - ./container:/opt/fleet/container:ro
      - ./templates:/opt/fleet/templates:ro
      - ./schemas:/opt/fleet/schemas:ro
      - ./container/sync-profile-skills.sh:/etc/cont-init.d/019-hollysys-profile-skills:ro
      - ./container/ensure-feishu.sh:/etc/cont-init.d/02-hollysys-feishu:ro
      - ./container/services.d/hollysys-worker-supervisor:/etc/services.d/hollysys-worker-supervisor:ro
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/hollysysctl
        - health
        - --probe
        - liveness
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    shm_size: 1gb

secrets:
  hollysys_controller_gitlab_token:
    file: ${HOLLYSYS_CONTROLLER_GITLAB_TOKEN_FILE:-./secrets/controller-gitlab-token}

volumes:
  controller-socket:

networks:
  default:
    ipam:
      config:
        - subnet: ${HOLLYSYS_DOCKER_SUBNET:-10.253.252.0/29}
