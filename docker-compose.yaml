services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.7.20@sha256:a6ce64e2038867885c2c90f6602425e6e70293d5e6d952a0e603a99265e01c40}
    platform: linux/amd64
    pull_policy: missing
    container_name: hermes
    restart: unless-stopped
    command: ["python", "-m", "hollysys_controller.daemon"]
    environment:
      HERMES_DASHBOARD: "1"
      # Bind inside the container so Docker can forward it, but publish only
      # on host loopback below. Plugin REST routes are therefore not on LAN.
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?set HERMES_DASHBOARD_BASIC_AUTH_PASSWORD in .env}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?set HERMES_DASHBOARD_BASIC_AUTH_SECRET in .env}
      HERMES_HOME: /opt/data
      PYTHONPATH: /opt/hollysys-controller-src
      HOLLYSYS_CONTROLLER_CONFIG: /opt/hollysys-controller/config.yaml
      HOLLYSYS_CONTROLLER_STATE_DIR: /opt/data/controller
      HOLLYSYS_CONTROLLER_SOCKET: /opt/data/controller/controller.sock
      HOLLYSYS_GITLAB_TOKEN_FILE: /opt/data/controller/gitlab-token
      HOLLYSYS_GITLAB_HOST: ${HOLLYSYS_GITLAB_HOST:-}
      HOLLYSYS_GITLAB_ALLOWED_GROUPS: ${HOLLYSYS_GITLAB_ALLOWED_GROUPS:-}
      HOLLYSYS_SPEC_REVIEWER_IDENTITIES: ${HOLLYSYS_SPEC_REVIEWER_IDENTITIES:-}
      HOLLYSYS_PLAN_REVIEWER_IDENTITIES: ${HOLLYSYS_PLAN_REVIEWER_IDENTITIES:-}
      HOLLYSYS_TASKS_REVIEWER_IDENTITIES: ${HOLLYSYS_TASKS_REVIEWER_IDENTITIES:-}
      HOLLYSYS_TESTER_IDENTITIES: ${HOLLYSYS_TESTER_IDENTITIES:-}
      HOLLYSYS_CODE_REVIEWER_IDENTITIES: ${HOLLYSYS_CODE_REVIEWER_IDENTITIES:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PATH: /opt/cli/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.dotnet:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PIP_CONFIG_FILE: /etc/pip.conf
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_EXTRA_INDEX_URL: ""
      UV_DEFAULT_INDEX: https://mirrors.aliyun.com/pypi/simple/
      UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      UV_EXTRA_INDEX_URL: ""
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com/
      npm_config_registry: https://registry.npmmirror.com/
      NPM_CONFIG_USERCONFIG: /opt/fleet/container/mirrors/npmrc
      COREPACK_NPM_REGISTRY: https://registry.npmmirror.com
      PNPM_CONFIG_REGISTRY: https://registry.npmmirror.com/
      YARN_NPM_REGISTRY_SERVER: https://registry.npmmirror.com/
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NOUS_API_KEY: ${NOUS_API_KEY:-}
    ports:
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - ${HERMES_DATA_DIR:-./data}:/opt/data
      - ${PROJECTS_DIR:-./projects}:/workspace/projects
      - ./cli:/opt/cli:ro
      - ./skills:/opt/skills:ro
      - ./hollysys_controller:/opt/hollysys-controller-src/hollysys_controller:ro
      - ./controller/config.yaml:/opt/hollysys-controller/config.yaml:ro
      - ./hollysysctl:/usr/local/bin/hollysysctl:ro
      - ./container:/opt/fleet/container:ro
      - ./container/ensure-dotnet8.sh:/etc/cont-init.d/00-hollysys-dotnet8:ro
      - ./container/mirrors/debian.sources:/etc/apt/sources.list.d/debian.sources:ro
      - ./container/mirrors/sources.list:/etc/apt/sources.list:ro
      - ./container/mirrors/pip.conf:/etc/pip.conf:ro
      - ./container/mirrors/uv.toml:/etc/uv/uv.toml:ro
      - ./templates:/opt/fleet/templates:ro
      - ./schemas:/opt/fleet/schemas:ro
    healthcheck:
      test: ["CMD", "python", "-m", "hollysys_controller.cli", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    shm_size: 1gb
