services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.7.20}
    platform: linux/amd64
    pull_policy: missing
    container_name: hermes
    restart: unless-stopped
    command: ["python", "-m", "hollysys_controller.daemon"]
    # .env is both the Compose interpolation file and the container environment
    # file. User settings and mirror addresses live there to keep this file small.
    env_file:
      - .env
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_HOME: /opt/data
      PYTHONPATH: /opt/hollysys-controller-src
      HOLLYSYS_CONTROLLER_CONFIG: /opt/hollysys-controller/config.yaml
      HOLLYSYS_CONTROLLER_STATE_DIR: /opt/data/controller
      HOLLYSYS_CONTROLLER_SOCKET: /opt/data/controller/controller.sock
      HOLLYSYS_GITLAB_TOKEN_FILE: /opt/data/controller/gitlab-token
      PATH: /opt/cli/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.dotnet:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PIP_CONFIG_FILE: /etc/pip.conf
      NPM_CONFIG_USERCONFIG: /opt/fleet/container/mirrors/npmrc
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - ${HERMES_DATA_DIR:-./data}:/opt/data
      - ${PROJECTS_DIR:-./projects}:/workspace/projects
      - ./cli:/opt/cli:ro
      - ./skills:/opt/skills:ro
      - ./hollysys_controller:/opt/hollysys-controller-src/hollysys_controller:ro
      - ./controller/config.yaml:/opt/hollysys-controller/config.yaml:ro
      - ./hollysysctl:/usr/local/bin/hollysysctl:ro
      - ./container:/opt/fleet/container:ro
      - ./container/ensure-dotnet8.sh:/etc/cont-init.d/00-hollysys-dotnet8:ro
      - ./container/mirrors/debian.sources:/etc/apt/sources.list.d/debian.sources:ro
      - ./container/mirrors/sources.list:/etc/apt/sources.list:ro
      - ./container/mirrors/pip.conf:/etc/pip.conf:ro
      - ./container/mirrors/uv.toml:/etc/uv/uv.toml:ro
      - ./templates:/opt/fleet/templates:ro
      - ./schemas:/opt/fleet/schemas:ro
    healthcheck:
      test: ["CMD", "python", "-m", "hollysys_controller.cli", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    shm_size: 1gb
