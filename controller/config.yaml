poll_interval_seconds: 2
reconcile_interval_seconds: 30
reconcile_workers: 4
outbox_poll_interval_seconds: 2
command_timeout_seconds: 120
start_request_sync_timeout_seconds: 10
controller_mode: preflight
notification_level: verbose
abort_confirmation_ttl_seconds: 600
dependency_backoff_initial_seconds: 5
dependency_backoff_max_seconds: 300
dependency_circuit_failure_threshold: 5
health_stale_seconds: 120
event_lag_warning_threshold: 100
outbox_warning_threshold: 20
worker_slow_warning_seconds: 900
worker_progress_lease_seconds: 1800
worker_heartbeat_stale_seconds: 300
worker_redispatch_limit: 2
merge_wait_retry_seconds: 30
merge_blocker_timeout_seconds: 3600
merge_draft_grace_seconds: 600
outbox_backoff_initial_seconds: 5
outbox_backoff_max_seconds: 300
document_review_limit: 3
code_modification_limit: 5
protocol_retry_limit: 2

stage_assignees:
  spec-write: spec-writer
  spec-review: spec-reviewer
  plan-write: planner
  plan-review: plan-reviewer
  tasks-write: tasker
  tasks-review: task-reviewer
  implement: coder
  test: tester
  code-review: code-reviewer

stage_skills:
  spec-write: [hollysys-write-spec, glab]
  spec-review: [hollysys-review-spec, glab]
  plan-write: [hollysys-write-plan, glab]
  plan-review: [hollysys-review-plan, glab]
  tasks-write: [hollysys-create-tasks, glab]
  tasks-review: [hollysys-analyze-tasks, glab]
  implement: [hollysys-implement, glab]
  test: [hollysys-test, glab]
  code-review: [hollysys-review-code, glab]

# These paths are relative to the immutable source PRD's sibling directory.
# For docs/prds/prd-example.md, every pattern is rooted below
# docs/prds/prd-example/. A run can never read or write another PRD's artifacts.
artifact_relative_patterns:
  spec-review:
    - "specs/spec-*.md"
  plan-review:
    - "plans/plan-*.md"
  tasks-review:
    - "tasks/task-*.md"
    - "tasks/tasks-*.md"

# Set these through HOLLYSYS_*_IDENTITIES in .env. Values may be GitLab username,
# numeric user id, or display name. Empty means the corresponding gate fails.
reviewer_identities:
  spec-review: []
  plan-review: []
  tasks-review: []
  test: []
  code-review: []
