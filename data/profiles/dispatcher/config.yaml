_config_version: 33
model:
  provider: openai-codex
  default: gpt-5.6-sol
  base_url: https://chatgpt.com/backend-api/codex
agent:
  reasoning_effort: xhigh
tool_output:
  max_bytes: 12000
  max_lines: 400
  max_line_length: 1000
toolsets: [terminal, file]
platform_toolsets:
  feishu: [terminal, file]

group_sessions_per_user: true

terminal:
  backend: local
  cwd: /workspace/projects
  home_mode: profile
  env_passthrough:
    - HERMES_PROFILE
    - GITLAB_HOST
    - GITLAB_ALLOWED_GROUPS
    - GITLAB_TOKEN
    - LARKSUITE_CLI_CONFIG_DIR
    - LARKSUITE_CLI_DATA_DIR
    - LARKSUITE_CLI_NO_UPDATE_NOTIFIER
    - LARKSUITE_CLI_NO_SKILLS_NOTIFIER
    - HOLLYSYS_CONTROLLER_SOCKET
    - HERMES_SCRATCH_DIR
    - NPM_CONFIG_OFFLINE
    - NPM_CONFIG_CACHE
    - NUGET_PACKAGES

approvals:
  mode: off

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true

curator:
  prune_builtins: false

skills:
  disabled:
    - airtable
    - architecture-diagram
    - arxiv
    - ascii-art
    - ascii-video
    - audiocraft-audio-generation
    - blender-mcp
    - blogwatcher
    - claude-design
    - evaluating-llms-harness
    - github-auth
    - github-code-review
    - github-issues
    - github-pr-workflow
    - github-repo-management
    - google-workspace
    - heartmula
    - himalaya
    - huggingface-hub
    - hyperframes
    - jupyter-live-kernel
    - kanban-video-orchestrator
    - llama-cpp
    - manim-video
    - maps
    - minecraft-modpack-server
    - notion
    - obsidian
    - openhue
    - p5js
    - petdex
    - pokemon-player
    - polymarket
    - research-paper-writing
    - segment-anything-model
    - serving-llms-vllm
    - songsee
    - songwriting-and-ai-music
    - spike
    - teams-meeting-pipeline
    - touchdesigner-mcp
    - weights-and-biases
    - youtube-content
    - yuanbao
  external_dirs:
    - /opt/skills/gitlab
    - /opt/skills/lark
  template_vars: true
  inline_shell: false
  guard_agent_created: true
  write_approval: true

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 20
  failure_limit: 3
  auto_decompose: false
  # Formal Hollysys notifications use the Controller's durable outbox. Do not
  # create a second automatic Kanban-notifier delivery path.
  auto_subscribe_on_create: false
  auto_promote_children: true
  orchestrator_profile: dispatcher
  default_assignee: dispatcher
  max_in_progress: 1
  max_in_progress_per_profile: 1

dashboard:
  show_token_analytics: true
  kanban:
    lane_by_profile: true
    include_archived_by_default: false
    render_markdown: true

platforms:
  feishu:
    extra:
      ws_reconnect_interval: 120
      ws_ping_interval: 30
      default_group_policy: open
