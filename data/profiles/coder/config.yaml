_config_version: 33
model:
  provider: openai-codex
  default: gpt-5.6-sol
  base_url: https://chatgpt.com/backend-api/codex
agent:
  reasoning_effort: xhigh
  max_turns: 500
  api_max_retries: 10
delegation:
  max_concurrent_children: 3
  max_summary_chars: 8192
tool_output:
  max_bytes: 12000
  max_lines: 400
  max_line_length: 1000
toolsets: [file, terminal]
terminal:
  backend: local
  cwd: /workspace/projects
  home_mode: profile
  env_passthrough:
    - HERMES_PROFILE
    - GITLAB_HOST
    - GITLAB_ALLOWED_GROUPS
    - GITLAB_TOKEN
    - HERMES_SCRATCH_DIR
    - HOLLYSYS_CONTROLLER_SOCKET
    - NPM_CONFIG_OFFLINE
    - NPM_CONFIG_CACHE
    - NUGET_PACKAGES
approvals:
  mode: off
  destructive_slash_confirm: false
memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: true
curator:
  prune_builtins: false
dashboard:
  show_token_analytics: true
skills:
  disabled:
    - airtable
    - architecture-diagram
    - arxiv
    - ascii-art
    - ascii-video
    - audiocraft-audio-generation
    - blender-mcp
    - blogwatcher
    - claude-design
    - evaluating-llms-harness
    - gif-search
    - github-auth
    - github-code-review
    - github-issues
    - github-pr-workflow
    - github-repo-management
    - google-workspace
    - heartmula
    - himalaya
    - huggingface-hub
    - hyperframes
    - jupyter-live-kernel
    - kanban-video-orchestrator
    - llama-cpp
    - manim-video
    - maps
    - minecraft-modpack-server
    - notion
    - obsidian
    - openhue
    - p5js
    - petdex
    - pokemon-player
    - polymarket
    - research-paper-writing
    - segment-anything-model
    - serving-llms-vllm
    - songsee
    - songwriting-and-ai-music
    - spike
    - teams-meeting-pipeline
    - touchdesigner-mcp
    - weights-and-biases
    - xurl
    - youtube-content
    - yuanbao
  external_dirs: [/opt/skills/gitlab]
  template_vars: true
  inline_shell: false
  guard_agent_created: true
  write_approval: true
